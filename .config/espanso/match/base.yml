# .config/espanso/match/base.yml
# Espanso match file
#
# 📂 Config file locations by OS:
# - Linux: $XDG_CONFIG_HOME/espanso (e.g. /home/user/.config/espanso)
# - Windows: %APPDATA%\espanso (e.g. C:\Users\user\AppData\Roaming\espanso)
# - macOS: $HOME/Library/Application Support/espanso
#
# For complete documentation, visit: https://espanso.org/docs/

matches:
  # Simple text replacement
  - trigger: ":espanso"
    replace: "Hi there!"

  # Dynamic replacements

  # Print the current date
  - trigger: ":date"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%m/%d/%Y"

  # Print the output of a shell command
  - trigger: ":shell"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "echo 'Hello from your shell'"

  # Spanish Accented Letters - Lowercase
  - trigger: ":a"
    replace: "á"
  - trigger: ":e"
    replace: "é"
  - trigger: ":i"
    replace: "í"
  - trigger: ":o"
    replace: "ó"
  - trigger: ":u"
    replace: "ú"
  - trigger: ":n"
    replace: "ñ"
  - trigger: ";u"
    replace: "ü"

  # Spanish Accented Letters - Uppercase
  - trigger: ":A"
    replace: "Á"
  - trigger: ":E"
    replace: "É"
  - trigger: ":I"
    replace: "Í"
  - trigger: ":O"
    replace: "Ó"
  - trigger: ":U"
    replace: "Ú"
  - trigger: ":N"
    replace: "Ñ"

  # Common Spanish Phrases
  - trigger: ":quepasa"
    replace: "¿Qué pasa?"
  - trigger: ":comoteva"
    replace: "¿Cómo te va?"
  - trigger: ":nosvemos"
    replace: "¡Nos vemos!"
  - trigger: ":hastaluego"
    replace: "¡Hasta luego!"
  - trigger: ":nolose"
    replace: "No lo sé."
  - trigger: ":gracias"
    replace: "¡Gracias!"
  - trigger: ":denada"
    replace: "De nada."
  - trigger: ":perdon"
    replace: "Perdón."
  - trigger: ":teamo"
    replace: "Te amo."
